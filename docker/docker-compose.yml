services:
  postgres:
    image: postgres:15
    container_name: credit_risk_postgres
    networks:
      - pipeline-net
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: credit_risk_pgadmin
    networks:
      - pipeline-net
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

  ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: credit_risk_ingestion
    networks:
      - pipeline-net
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: credit_risk_runner
    networks:
      - pipeline-net
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-key.json
    volumes:
      - ..:/workspace
      - ../secrets:/secrets:ro
    command: tail -f /dev/null
    depends_on:
      postgres:
        condition: service_healthy

  kestra:
    build:
      context: ..
      dockerfile: docker/kestra.Dockerfile
    container_name: credit_risk_kestra
    user: "root"
    networks:
      - pipeline-net
    command: server standalone --flow-path /flows
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${KESTRA_DB_NAME}
            driverClassName: org.postgresql.Driver
            username: ${DB_USER}
            password: ${DB_PASSWORD}
        kestra:
          server:
            basicAuth:
              enabled: true
              username: admin@kestra.io
              password: Admin1234
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
          tasks:
            tmp-dir:
              path: /app/tmp
          url: http://localhost:8081/
    ports:
      - "8081:8080"
      - "8082:8081"
    volumes:
      - kestra_data:/app/storage
      - kestra_tmp:/app/tmp
      - /var/run/docker.sock:/var/run/docker.sock
      - ../orchestration/flows:/flows
    depends_on:
      postgres:
        condition: service_healthy

  kestra_importer:
    image: curlimages/curl:8.8.0
    container_name: credit_risk_kestra_importer
    networks:
      - pipeline-net
    depends_on:
      - kestra
    volumes:
      - ../orchestration/flows:/flows:ro
    entrypoint:
      - sh
      - -ec
      - |
          until curl -sf http://kestra:8081/health; do
            echo "Waiting for Kestra..."
            sleep 2
          done
          echo "Importing flow..."
          curl -v --fail --show-error --max-time 30 -X POST -u admin@kestra.io:Admin1234 -H "Content-Type: application/x-yaml" --data-binary "@/flows/credit_risk_pipeline.yaml" http://kestra:8080/api/v1/main/flows
          echo "Flow imported."
    restart: "no"

volumes:
  postgres_data:
  kestra_data:
  kestra_tmp:

networks:
  pipeline-net:
    driver: bridge