services:
  postgres:
    image: postgres:15
    container_name: credit_risk_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: credit_risk_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

  ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: credit_risk_ingestion
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: